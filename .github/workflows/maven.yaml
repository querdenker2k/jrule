name: Java CI
on: [ push,pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: 'maven'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Build with Maven
      run: mvn --batch-mode --update-snapshots install
    - run: mkdir staging && cp target/org.openhab.automation.jrule*SNAPSHOT.jar staging
    - uses: actions/upload-artifact@v4
      with:
        name: JRule-jar-zipped_build_${{ github.run_id }}
        path: staging
    - run: mkdir -p staging-maven/org/openhab/addons/bundles && cp -r ~/.m2/repository/org/openhab/addons/bundles/org.openhab.automation.jrule staging-maven/org/openhab/addons/bundles/
    - uses: actions/upload-artifact@v4
      with:
        name: JRule-maven-artifact_build_${{ github.run_id }}
        path: staging-maven
    - name: Deploy to GitHub Packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: mvn --batch-mode deploy -DskipTests --settings ${{ github.workspace }}/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
